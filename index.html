<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BARNES Moscow — офис и контакты</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="office-contact" aria-labelledby="office-contact-title">
        <div class="office-contact__inner">
          <div class="office-contact__grid">
            <div class="office-contact__copy">
              <h1 id="office-contact-title">Личный подход BARNES</h1>
              <p class="office-contact__lead">Будем рады встретить вас в нашем офисе и обсудить ваши задачи в сфере элитной недвижимости.</p>

              <address class="office-contact__address">
                <a href="mailto:moscow@barn-estate.com">moscow@barn-estate.com</a>
                <span>ул. Петровка, дом 19, стр. 1</span>
              </address>

              <nav class="office-contact__socials" aria-label="Социальные сети BARNES Moscow">
                <a class="office-contact__social" href="https://wa.me/79252621650" target="_blank" rel="noreferrer" aria-label="Написать в WhatsApp по номеру 8 (925) 262-16-50">
                  <img class="office-contact__brand-icon" src="assets/whatsapp.svg" alt="" />
                  <span>WhatsApp</span>
                  <span class="office-contact__arrow" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none">
                      <path d="M3 13 13 3M5 3h8v8" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" />
                    </svg>
                  </span>
                </a>

                <a class="office-contact__social" href="https://t.me/art_de_vivre_barnes" target="_blank" rel="noreferrer">
                  <img class="office-contact__brand-icon" src="assets/telegram.svg" alt="" />
                  <span>Telegram</span>
                  <span class="office-contact__arrow" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none">
                      <path d="M3 13 13 3M5 3h8v8" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" />
                    </svg>
                  </span>
                </a>

                <a class="office-contact__social" href="https://max.ru/" target="_blank" rel="noreferrer">
                  <img class="office-contact__brand-icon office-contact__brand-icon--max" src="assets/max.svg" alt="" />
                  <span>MAX</span>
                  <span class="office-contact__arrow" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none">
                      <path d="M3 13 13 3M5 3h8v8" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" />
                    </svg>
                  </span>
                </a>

                <a class="office-contact__social" href="tel:+74992724872" aria-label="Позвонить по номеру +7 (499) 272-48-72">
                  <svg class="office-contact__phone-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <path d="M7.3 3.5 5.6 4.6c-.94.62-.98 1.98-.58 3.04 1.84 4.86 5.7 8.72 10.56 10.56 1.06.4 2.42.36 3.04-.58l1.1-1.7c.38-.58.2-1.35-.4-1.7l-3.12-1.82a1.22 1.22 0 0 0-1.57.28l-.84 1.04a12.82 12.82 0 0 1-3.95-3.95l1.04-.84c.47-.38.59-1.05.28-1.57L9.32 3.9c-.35-.6-1.12-.78-1.7-.4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                  </svg>
                  <span>+7 (499) 272-48-72</span>
                  <span class="office-contact__arrow" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none">
                      <path d="M3 13 13 3M5 3h8v8" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" />
                    </svg>
                  </span>
                </a>
              </nav>
            </div>

            <div class="office-contact__visual" aria-hidden="true">
              <picture>
                <source media="(max-width: 540px)" srcset="assets/office-lobby.png" />
                <img src="assets/office-lobby.png" alt="" />
              </picture>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
